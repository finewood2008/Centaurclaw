<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#1BA0D8" opacity="0.15"/>
  <!-- Horse body (blue) -->
  <ellipse cx="60" cy="78" rx="28" ry="18" fill="#1BA0D8"/>
  <!-- Horse legs -->
  <rect x="38" y="88" width="7" height="20" rx="3" fill="#1BA0D8"/>
  <rect x="50" y="90" width="7" height="18" rx="3" fill="#1BA0D8"/>
  <rect x="63" y="90" width="7" height="18" rx="3" fill="#1BA0D8"/>
  <rect x="75" y="88" width="7" height="20" rx="3" fill="#1BA0D8"/>
  <!-- Horse neck -->
  <ellipse cx="45" cy="67" rx="9" ry="13" fill="#1BA0D8" transform="rotate(-20 45 67)"/>
  <!-- Horse head -->
  <ellipse cx="36" cy="55" rx="10" ry="8" fill="#1BA0D8" transform="rotate(-30 36 55)"/>
  <!-- Human torso (orange rider) -->
  <ellipse cx="58" cy="58" rx="12" ry="16" fill="#F5921B"/>
  <!-- Human head -->
  <circle cx="58" cy="38" r="12" fill="#F5921B"/>
  <!-- Human arms -->
  <ellipse cx="42" cy="56" rx="6" ry="14" fill="#F5921B" transform="rotate(30 42 56)"/>
  <ellipse cx="74" cy="56" rx="6" ry="14" fill="#F5921B" transform="rotate(-30 74 56)"/>
  <!-- Mane / hair highlight -->
  <path d="M38 48 Q30 38 34 28 Q42 20 48 30" stroke="#F5921B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="32" cy="53" r="2" fill="white"/>
  <circle cx="32" cy="53" r="1" fill="#0D2A3B"/>
</svg>
